<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Letter For Halima</title>
<meta name="description" content="A letter, written for you — in English, Urdu and Arabic.">
<meta name="theme-color" content="#fff5f2">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="A Letter For Halima">
<meta property="og:description" content="Tap to open.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Nastaliq+Urdu:wght@400;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   A LETTER FOR YOU — single file, no build step.
   Palette: rose & blush. Mobile first. EN / UR / AR.
   ========================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

:root{
  --bg-1:#fff6f3;
  --bg-2:#ffe9ee;
  --bg-3:#fce4da;
  --paper:#fffaf7;
  --paper-edge:#f3ddd3;
  --ink:#4c2f2c;
  --ink-soft:#8a6560;
  --ink-faint:#b08e89;
  --rose:#e2879a;
  --rose-deep:#bf5d76;
  --rose-light:#f8cdd6;
  --gold:#c7a15a;
  --radius:20px;
  --shadow-lg:0 26px 60px -24px rgba(150,70,88,.45);
  --shadow-sm:0 8px 24px -12px rgba(150,70,88,.40);
  --bar-h:58px;
}

body{
  min-height:100vh;
  min-height:100svh;
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(60vmax 60vmax at 12% -8%, #ffd9e2 0%, rgba(255,217,226,0) 62%),
    radial-gradient(52vmax 52vmax at 92% 8%, #ffe6d5 0%, rgba(255,230,213,0) 60%),
    radial-gradient(70vmax 70vmax at 50% 108%, #ffdce6 0%, rgba(255,220,230,0) 64%),
    linear-gradient(170deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}

/* ---------- falling petals ---------- */
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ---------- top bar / language switcher ---------- */
.bar{
  position:fixed; inset-inline:0; top:0; z-index:40;
  display:flex; justify-content:center;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:linear-gradient(to bottom, rgba(255,246,243,.94), rgba(255,246,243,0));
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.langs{
  display:flex; gap:2px; padding:4px;
  background:rgba(255,255,255,.74);
  border:1px solid rgba(191,93,118,.18);
  border-radius:999px;
  box-shadow:var(--shadow-sm);
}
.langs button{
  appearance:none; border:0; cursor:pointer;
  font:inherit; font-size:.86rem; font-weight:500;
  color:var(--ink-soft);
  padding:8px 15px; border-radius:999px;
  background:transparent; min-height:38px;
  transition:color .25s, background .25s;
}
.langs button[aria-pressed="true"]{
  color:#fff;
  background:linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
  box-shadow:0 6px 16px -8px var(--rose-deep);
}
.langs button:focus-visible{outline:2px solid var(--rose-deep); outline-offset:2px}
.langs .f-ur{font-family:'Noto Nastaliq Urdu',serif; font-size:.8rem; line-height:2}
.langs .f-ar{font-family:'Amiri',serif; font-size:1rem}

.screen{position:relative; z-index:10}
.screen[hidden]{display:none !important}

/* ================== ENVELOPE ================== */
#stage{
  min-height:100vh;
  min-height:100svh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:34px;
  padding:calc(var(--bar-h) + env(safe-area-inset-top) + 20px) 20px calc(40px + env(safe-area-inset-bottom));
  transition:opacity .55s ease, transform .55s ease;
}
#stage.gone{opacity:0; transform:scale(.94); pointer-events:none}

.env-wrap{perspective:1400px}
.env{
  position:relative;
  width:min(84vw,360px);
  aspect-ratio:1.4/1;
  cursor:pointer; border:0; padding:0; background:none;
  appearance:none; -webkit-appearance:none;
  perspective:1200px; transform-style:preserve-3d;
  animation:breathe 4.2s ease-in-out infinite;
}
.env:focus-visible{outline:3px solid var(--rose-deep); outline-offset:14px; border-radius:14px}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.env.open{animation:none; cursor:default}

.env__back,.env__front,.env__flap{position:absolute; inset:0; border-radius:10px}
.env__back{
  background:linear-gradient(150deg,#f3b6c4 0%, #e08fa2 100%);
  box-shadow:var(--shadow-lg); z-index:0;
}
.env__paper{
  position:absolute; z-index:2;
  inset-inline:7%; bottom:8%; height:86%;
  background:linear-gradient(175deg,#fffdfb 0%, var(--paper) 60%, #fdeee7 100%);
  border-radius:6px; overflow:hidden;
  box-shadow:0 -6px 18px -8px rgba(150,70,88,.35);
  transition:transform .85s cubic-bezier(.3,.9,.3,1);
}
.env__paper::before{
  content:''; position:absolute; inset:14% 16%;
  background:repeating-linear-gradient(to bottom, rgba(176,142,137,.3) 0 1.5px, transparent 1.5px 13px);
  opacity:.55;
}
.env.open .env__paper{transform:translateY(-46%) scale(1.03)}

.env__front{
  z-index:3;
  background:linear-gradient(160deg,#f7c3ce 0%, #eda7b8 100%);
  clip-path:polygon(0 100%, 0 8%, 50% 42%, 100% 8%, 100% 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.env__flap{
  z-index:5;
  background:linear-gradient(170deg,#f2b2c1 0%, #e498ab 100%);
  clip-path:polygon(0 0, 100% 0, 50% 44%);
  transform-origin:top center;
  transition:transform .8s cubic-bezier(.45,.05,.3,1), z-index 0s linear .4s;
}
.env.open .env__flap{transform:rotateX(178deg); z-index:1}

.seal{
  position:absolute; z-index:6;
  top:42%; left:50%; transform:translate(-50%,-50%);
  width:clamp(34px,9vw,44px); aspect-ratio:1; border-radius:50%;
  display:grid; place-items:center; pointer-events:none;
  background:radial-gradient(circle at 34% 30%, #e88ca0 0%, var(--rose-deep) 58%, #9c4159 100%);
  color:#fff7f9; font-size:clamp(13px,3.4vw,17px);
  box-shadow:0 6px 18px -6px rgba(140,55,75,.75), inset 0 2px 5px rgba(255,255,255,.35);
  transition:transform .45s ease, opacity .45s ease;
}
.env.open .seal{transform:translate(-50%,-50%) scale(.2) rotate(120deg); opacity:0}

/* ---- postage stamp (sits on the front, clear of the flap) ---- */
.env__stamp{
  position:absolute; z-index:4; pointer-events:none;
  left:8%; top:26%; width:13%;
  transform:rotate(-3.5deg);
  filter:drop-shadow(0 3px 6px rgba(150,70,88,.28));
}
.env__stamp svg{display:block; width:100%; height:auto}

/* ---- her name, written by hand ---- */
.env__postmark{
  position:absolute; z-index:5; pointer-events:none;
  left:15%; top:31%; width:19%;
  transform:rotate(-13deg); opacity:.24;
}
.env__postmark svg{display:block; width:100%; height:auto; overflow:visible}

.env__addr{
  position:absolute; z-index:4; pointer-events:none;
  inset-inline:6%; bottom:3%; height:44%;
  display:flex; flex-direction:column; align-items:center; gap:1%;
}
.env__to{
  flex:0 0 auto;
  font-family:'Outfit',sans-serif; font-size:clamp(9px,2.4vw,12px);
  letter-spacing:.18em; color:#a95f74; opacity:0;
  transition:opacity .9s ease .2s;
}
.env__addr.armed .env__to{opacity:.6}
html[lang="ur"] .env__to{font-family:'Noto Nastaliq Urdu',serif; letter-spacing:0; line-height:1.9}
html[lang="ar"] .env__to{font-family:'Amiri',serif; letter-spacing:.04em}
.env__nameCv{flex:1 1 0%; display:block; width:100%; min-height:0}


.hint{
  margin:0; text-align:center;
  color:var(--ink-soft); font-size:.95rem; letter-spacing:.04em;
  opacity:0; transition:opacity .7s ease;
}
#stage.written .hint{opacity:1; animation:pulse 2.6s ease-in-out .3s infinite}
.hint .tap-ico{display:block; font-size:1.3rem; margin-bottom:6px; opacity:.8}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
#stage.opening .hint{opacity:0; animation:none}

/* ================== LETTER ================== */
#letterScreen{
  padding:calc(var(--bar-h) + env(safe-area-inset-top) + 18px) 16px calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:center;
}
.letter{
  width:100%; max-width:660px; position:relative; overflow:hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 30%),
    linear-gradient(172deg,#fffdfc 0%, var(--paper) 55%, #fdf0ea 100%);
  border:1px solid var(--paper-edge);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:clamp(22px,6vw,46px) clamp(20px,5.5vw,44px) clamp(28px,6vw,48px);
  text-align:start;
}
.letter::before{
  content:''; position:absolute; inset-inline:0; top:0; height:4px;
  background:linear-gradient(90deg,var(--rose-light),var(--rose),var(--gold),var(--rose),var(--rose-light));
  opacity:.75;
}

.dateline{
  font-size:.78rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-faint); margin:0 0 22px;
}
.greeting{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.55rem,6.4vw,2.3rem);
  font-weight:600; line-height:1.3;
  color:var(--rose-deep); margin:0 0 20px;
}
.letter p.body{
  margin:0 0 1.15em;
  font-size:clamp(1rem,4.1vw,1.09rem);
  line-height:1.85; color:var(--ink);
}

.verse{
  margin:26px 0 28px;
  padding:20px clamp(16px,4.4vw,24px);
  border-radius:14px; position:relative;
  background:linear-gradient(160deg, rgba(255,240,244,.9), rgba(255,247,238,.9));
  border:1px solid rgba(199,161,90,.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);
}
.verse__ar{
  font-family:'Amiri',serif; direction:rtl; text-align:center;
  font-size:clamp(1.22rem,5.4vw,1.5rem);
  line-height:2.05; color:#7a4a33; margin:0;
}
.verse__tr{
  margin:14px 0 0; text-align:center;
  font-size:clamp(.92rem,3.7vw,1rem); line-height:1.75;
  color:var(--ink-soft); font-style:italic;
}
.verse__ref{
  display:block; margin-top:12px; text-align:center;
  font-size:.76rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold); font-style:normal;
}

.promise-intro{margin:26px 0 14px !important; font-weight:500}
.promises{list-style:none; margin:0 0 6px; padding:0}
.promises li{
  position:relative; padding-inline-start:30px; margin-bottom:14px;
  font-size:clamp(.97rem,3.9vw,1.05rem); line-height:1.8; color:var(--ink);
}
.promises li::before{
  content:'\2661'; position:absolute; inset-inline-start:0; top:0;
  color:var(--rose); font-size:1.05em;
}

.rule{border:0; height:1px; margin:30px auto; width:56%;
  background:linear-gradient(90deg,transparent,var(--rose-light),transparent)}
.closing{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.15rem,4.7vw,1.4rem);
  font-style:italic; line-height:1.6;
  color:var(--rose-deep); margin:0 0 8px;
}
.signoff{
  margin:18px 0 2px; font-size:.86rem; letter-spacing:.06em;
  color:var(--ink-soft);
}
.sign{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.5rem,6vw,2rem);
  font-weight:600; color:var(--ink); margin:4px 0 0;
}
.ps{margin:26px 0 0; font-size:.92rem; line-height:1.75;
  color:var(--ink-soft); font-style:italic}

.actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
  margin:30px auto 8px; max-width:660px}
.btn{
  appearance:none; font:inherit; cursor:pointer;
  border-radius:999px; padding:13px 24px; min-height:46px;
  font-size:.92rem; font-weight:500;
  transition:transform .2s ease, box-shadow .25s ease, background .25s;
}
.btn:active{transform:scale(.96)}
.btn--love{border:0; color:#fff;
  background:linear-gradient(135deg,var(--rose) 0%, var(--rose-deep) 100%);
  box-shadow:0 12px 26px -14px var(--rose-deep)}
.btn--ghost{background:rgba(255,255,255,.7);
  border:1px solid rgba(191,93,118,.28); color:var(--rose-deep)}
.btn:focus-visible{outline:2px solid var(--rose-deep); outline-offset:3px}

.credit{text-align:center; margin:22px 0 0;
  font-size:.74rem; letter-spacing:.1em; color:var(--ink-faint)}

.reveal{opacity:0; transform:translateY(16px);
  animation:rise .75s cubic-bezier(.22,.8,.3,1) forwards}
@keyframes rise{to{opacity:1; transform:none}}

/* ============ per-script typography ============ */
html[lang="ur"] .letter p.body,
html[lang="ur"] .promises li,
html[lang="ur"] .ps,
html[lang="ur"] .verse__tr{
  font-family:'Noto Nastaliq Urdu',serif;
  line-height:2.75; font-size:clamp(.94rem,3.75vw,1.02rem); font-style:normal;
}
html[lang="ur"] .greeting,
html[lang="ur"] .closing,
html[lang="ur"] .sign{
  font-family:'Noto Nastaliq Urdu',serif;
  line-height:2.1; font-style:normal;
  font-size:clamp(1.18rem,4.8vw,1.55rem);
}
html[lang="ur"] .sign{font-size:clamp(1.3rem,5.2vw,1.7rem)}
html[lang="ur"] .signoff{font-family:'Noto Nastaliq Urdu',serif; line-height:2.2; letter-spacing:0}
html[lang="ur"] .hint,
html[lang="ur"] .btn,
html[lang="ur"] .dateline{font-family:'Noto Nastaliq Urdu',serif; line-height:2.1}
html[lang="ur"] .dateline{text-transform:none; letter-spacing:0}

html[lang="ar"] .letter p.body,
html[lang="ar"] .promises li,
html[lang="ar"] .ps,
html[lang="ar"] .verse__tr{
  font-family:'Amiri',serif; line-height:2.15;
  font-size:clamp(1.1rem,4.5vw,1.22rem); font-style:normal;
}
html[lang="ar"] .greeting,
html[lang="ar"] .closing,
html[lang="ar"] .sign{font-family:'Amiri',serif; font-style:normal}
html[lang="ar"] .signoff{font-family:'Amiri',serif; font-size:.98rem}
html[lang="ar"] .hint,
html[lang="ar"] .btn,
html[lang="ar"] .dateline{font-family:'Amiri',serif}
html[lang="ar"] .dateline{text-transform:none; letter-spacing:.04em}

html[dir="rtl"] .promises li::before{transform:scaleX(-1)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important; scroll-behavior:auto !important;
  }
  .reveal{opacity:1; transform:none}
}
@media (min-width:700px){:root{--bar-h:64px}}
</style>
</head>
<body>

<canvas id="petals" aria-hidden="true"></canvas>

<header class="bar">
  <div class="langs" role="group" id="langs" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="false">English</button>
    <button type="button" data-lang="ur" class="f-ur" aria-pressed="true">اردو</button>
    <button type="button" data-lang="ar" class="f-ar" aria-pressed="false">العربية</button>
  </div>
</header>

<!-- ===================== ENVELOPE SCREEN ===================== -->
<main class="screen" id="stage">
  <div class="env-wrap">
    <button class="env" id="env" type="button">
      <span class="env__back"></span>
      <span class="env__paper"></span>
      <span class="env__front"></span>
      <span class="env__flap"></span>
      <span class="env__stamp" aria-hidden="true">
        <svg viewBox="0 0 64 78">
          <rect x="2" y="2" width="60" height="74" rx="3" fill="#fffaf6"/>
          <rect x="2" y="2" width="60" height="74" rx="3" fill="none"
                stroke="#f2b7c6" stroke-width="4.6" stroke-dasharray="0 7.6" stroke-linecap="round"/>
          <rect x="8" y="8" width="48" height="62" rx="2" fill="#f9d3dc"/>
          <path d="M32 46c-9-6-13-11-13-16a6.6 6.6 0 0 1 13-2.6A6.6 6.6 0 0 1 45 30c0 5-4 10-13 16z" fill="#c05f77"/>
          <text x="32" y="62" text-anchor="middle" font-family="Amiri, serif" font-size="9" fill="#a95f74">&#1605;&#1581;&#1576;&#1578;</text>
        </svg>
      </span>

      <span class="env__postmark" aria-hidden="true">
        <svg viewBox="0 0 96 56">
          <g fill="none" stroke="#7a3347" stroke-width="2.2" stroke-linecap="round">
            <circle cx="28" cy="28" r="24"/>
            <circle cx="28" cy="28" r="18.5" stroke-width="1.4"/>
            <path d="M56 17c8-4 16 4 24 0M56 28c8-4 16 4 24 0M56 39c8-4 16 4 24 0"/>
          </g>
        </svg>
      </span>

      <span class="env__addr" id="envAddr" aria-hidden="true">
        <span class="env__to" id="envTo"></span>
        <canvas class="env__nameCv" id="nameCv"></canvas>
      </span>

      <span class="seal" aria-hidden="true">&#10084;</span>
    </button>
  </div>
  <p class="hint" id="hint"><span class="tap-ico" aria-hidden="true">&#128072;</span><span data-t="tapHint">کھولنے کے لیے چھوئیں</span></p>
</main>

<!-- ===================== LETTER SCREEN ===================== -->
<main class="screen" id="letterScreen" hidden>
  <article class="letter" id="letter" tabindex="-1">
    <p class="dateline" data-t="dateline"></p>
    <h1 class="greeting" data-t="greeting"></h1>
    <div id="paras"></div>

    <blockquote class="verse">
      <p class="verse__ar">وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً</p>
      <p class="verse__tr" id="verseTr"></p>
      <cite class="verse__ref" id="verseRef"></cite>
    </blockquote>

    <div id="parasAfter"></div>

    <p class="body promise-intro" data-t="promiseIntro"></p>
    <ul class="promises" id="promises"></ul>

    <hr class="rule">
    <p class="closing" data-t="closing"></p>
    <p class="signoff" data-t="signOff"></p>
    <p class="sign" id="sign"></p>
    <p class="ps" data-t="ps"></p>
  </article>

  <div class="actions">
    <button class="btn btn--love" id="loveBtn" type="button" data-t="loveBtn"></button>
    <button class="btn btn--ghost" id="resealBtn" type="button" data-t="reseal"></button>
  </div>
  <p class="credit" data-t="credit"></p>
</main>

<script>
/* ==========================================================
   1. CONFIG — edit these two lines and you are done.
   ========================================================== */
const CONFIG = {
  // Who it is for (used inside the greeting)
  to:   { en: "Halima", ur: "حلیمہ", ar: "حليمة" },
  // What the pen writes on the envelope — one array entry per line
  envelope: {
    en: ["My love,", "Halima"],
    ur: ["میری جان", "حلیمہ"],
    ar: ["حبيبتي", "حليمة"]
  },
  // Who it is from (the signature)
  from: { en: "Ahmed",  ur: "احمد",  ar: "أحمد" },
  // Small line above the greeting
  date: { en: "Written for you",  ur: "تمہارے نام",  ar: "كُتِبت لكِ" }
};

/* ==========================================================
   2. CONTENT
   ========================================================== */
const CONTENT = {
  en: {
    dir: "ltr",
    tapHint: "Tap to open",
    toLabel: "To",
    greeting: "Assalamu Alaikum, {to} —",
    before: [
      "Long before I knew your name, I was already asking Allah for you. I did not know your face, or the sound of your laugh, or the particular way you say my name when you are half asleep. But He knew. And while I was still learning how to ask, He had already written you into my life.",
      "There is a verse I used to recite the way one recites poetry — beautiful, but distant, as though it belonged to someone else's life."
    ],
    verseTr: "“And among His signs is that He created for you mates from among yourselves, that you may find tranquillity in them; and He placed between you affection and mercy.”",
    verseRef: "Surah Ar-Rum, 30:21",
    after: [
      "Then you came, and it stopped being poetry. It became a plain description of my ordinary days.",
      "Sukoon. That is the word. Not noise, not excitement — sukoon. On the days when the world is loud and I have nothing left to give anyone, I come home to you and the noise simply sets, the way the sun does. You are the quietest proof I have ever been given that Allah listens."
    ],
    promiseIntro: "So let me promise you a few things, plainly, with Allah as my witness:",
    promises: [
      "To be gentle with you — especially on the days you find it hard to be gentle with yourself.",
      "To guard your heart, your honour and your peace the way I would guard my own.",
      "To be your friend first: the one you tell things to before anyone else.",
      "To choose you again, deliberately, every single morning.",

/* ==========================================================
   3. LANGUAGE ENGINE
   ========================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const els = {
  html: document.documentElement,
  langs: $("#langs"),
  paras: $("#paras"),
  parasAfter: $("#parasAfter"),
  promises: $("#promises"),
  verseTr: $("#verseTr"),
  verseRef: $("#verseRef"),
  sign: $("#sign"),
  verse: $(".verse"),
  addr: $("#envAddr"),
  envTo: $("#envTo"),
  nameCv: $("#nameCv")
};

let lang = "en";

const DEFAULT_LANG = "ur";   // page pehli baar is zabaan mein khulta hai

function pickInitialLang() {
  let saved = null;
  try { saved = localStorage.getItem("letter-lang"); } catch (e) {}
  return (saved && CONTENT[saved]) ? saved : DEFAULT_LANG;
}

function paragraphs(list, host) {
  host.innerHTML = "";
  list.forEach(text => {
    const p = document.createElement("p");
    p.className = "body";
    p.textContent = text;
    host.appendChild(p);
  });
}

function applyLang(next, animate) {
  lang = next;
  const c = CONTENT[lang];

  els.html.lang = lang;
  els.html.dir = c.dir;
  els.langs.setAttribute("aria-label", c.langLabel);
  env.setAttribute("aria-label", c.tapHint);

  $$("#langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang))
  );

  // simple [data-t] bindings, with {to} token support
  $$("[data-t]").forEach(el => {
    let v = c[el.dataset.t] ?? CONFIG[el.dataset.t]?.[lang] ?? "";
    if (el.dataset.t === "dateline") v = CONFIG.date[lang];
    v = String(v).replace("{to}", CONFIG.to[lang]);
    el.textContent = v;
  });

  paragraphs(c.before, els.paras);
  paragraphs(c.after, els.parasAfter);

  els.promises.innerHTML = "";
  c.promises.forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    els.promises.appendChild(li);
  });

  els.verseTr.textContent = c.verseTr;
  els.verseTr.hidden = !c.verseTr;
  els.verseRef.textContent = c.verseRef;
  els.sign.textContent = CONFIG.from[lang];
  els.envTo.textContent = c.toLabel;

  try { localStorage.setItem("letter-lang", lang); } catch (e) {}

  if (animate) staggerReveal();
}

function staggerReveal() {
  const nodes = [
    $(".dateline"), $(".greeting"),
    ...$$("#paras .body"), els.verse, ...$$("#parasAfter .body"),
    $(".promise-intro"), ...$$("#promises li"),
    $(".rule"), $(".closing"), $(".signoff"), $(".sign"), $(".ps"), $(".actions")
  ].filter(Boolean);

  nodes.forEach((n, i) => {
    n.classList.remove("reveal");
    void n.offsetWidth;                 // restart the animation
    n.style.animationDelay = Math.min(i * 55, 900) + "ms";
    n.classList.add("reveal");
  });
}

els.langs.addEventListener("click", e => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn || btn.dataset.lang === lang) return;
  const onEnvelope = $("#letterScreen").hidden;
  applyLang(btn.dataset.lang, !onEnvelope);
  if (onEnvelope) writeName();
});

/* ==========================================================
   4. ENVELOPE → LETTER
   ========================================================== */
const stage = $("#stage");
const env = $("#env");
const letterScreen = $("#letterScreen");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let busy = false;

function openLetter() {
  if (busy || env.classList.contains("open")) return;
  busy = true;
  env.classList.add("open");
  stage.classList.add("opening");
  burst(innerWidth / 2, innerHeight / 2, 16);

  const t1 = reduced ? 0 : 1250;
  setTimeout(() => {
    stage.classList.add("gone");
    setTimeout(() => {
      stage.hidden = true;
      letterScreen.hidden = false;
      window.scrollTo({ top: 0, behavior: "auto" });
      staggerReveal();
      $("#letter").focus({ preventScroll: true });
      busy = false;
    }, reduced ? 0 : 520);
  }, t1);
}

/* ---- the qalam ------------------------------------------------------
   Her name is drawn offscreen in the real Nastaliq face, then the ink
   is split into connected components. The big ones are strokes; the
   small isolated ones are the nuqte. The nib sweeps each line column by
   column, riding the actual ink — so it climbs the alif and dips into
   the descenders — and the dots are only tapped in afterwards, the way
   a khattat writes. Works for any string in any of the three scripts.
   ------------------------------------------------------------------ */
const nctx = els.nameCv.getContext("2d");
const INK = "#6c2f45";

let scene = null, penRaf = null, penToken = 0;

const easeWrite = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function fontFor(px) {
  if (lang === "ur") return '600 ' + px + 'px "Noto Nastaliq Urdu", serif';
  if (lang === "ar") return '700 ' + px + 'px "Amiri", serif';
  return '600 ' + px + 'px "Cormorant Garamond", serif';
}

function offscreen(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}

function buildScene() {
  const box = els.nameCv.getBoundingClientRect();
  if (box.width < 40 || box.height < 20) return null;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = Math.min(Math.round(box.width * dpr), 1100);
  const H = Math.max(Math.round(W * box.height / box.width), 40);
  els.nameCv.width = W; els.nameCv.height = H;

  const lines = CONFIG.envelope[lang];
  const rtl = CONTENT[lang].dir === "rtl";

  /* fit both lines into the box */
  const probe = 120;
  nctx.font = fontFor(probe);
  nctx.textAlign = "center";
  nctx.textBaseline = "alphabetic";
  const m = lines.map(t => nctx.measureText(t));
  const asc = m.map(x => x.actualBoundingBoxAscent || probe * .8);
  const dsc = m.map(x => x.actualBoundingBoxDescent || probe * .3);
  const gap = probe * .14;
  const stackH = asc.concat(dsc).reduce((a, b) => a + b, 0) + gap * (lines.length - 1);
  const widest = Math.max.apply(null, m.map(x => x.width));
  const size = probe * Math.min((W * .92) / widest, (H * .94) / stackH);
  const k = size / probe;

  /* lay the ink down */
  const full = offscreen(W, H);
  const fctx = full.getContext("2d", { willReadFrequently: true });
  fctx.font = fontFor(size);
  fctx.textAlign = "center";
  fctx.textBaseline = "alphabetic";
  fctx.fillStyle = INK;

  const bands = [];
  let cursor = (H - stackH * k) / 2;
  lines.forEach((t, i) => {
    const base = cursor + asc[i] * k;
    fctx.fillText(t, W / 2, base);
    bands.push([Math.max(0, Math.floor(cursor) - 1), Math.min(H, Math.ceil(base + dsc[i] * k) + 1)]);
    cursor = base + dsc[i] * k + gap * k;
  });

  /* label the connected blobs of ink */
  const a = fctx.getImageData(0, 0, W, H).data;
  const N = W * H, CUT = 26;
  const label = new Int32Array(N).fill(-1);
  const stack = new Int32Array(N);
  const comps = [];
  for (let i = 0; i < N; i++) {
    if (a[i * 4 + 3] < CUT || label[i] !== -1) continue;
    const c = { x0: W, y0: H, x1: 0, y1: 0, area: 0, sy: 0 };
    let sp = 0; stack[sp++] = i; label[i] = comps.length;
    while (sp) {
      const q = stack[--sp], qx = q % W, qy = (q / W) | 0;
      c.area++; c.sy += qy;
      if (qx < c.x0) c.x0 = qx;
      if (qx > c.x1) c.x1 = qx;
      if (qy < c.y0) c.y0 = qy;
      if (qy > c.y1) c.y1 = qy;
      for (let dy = -1; dy <= 1; dy++) {
        const ny = qy + dy; if (ny < 0 || ny >= H) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const nx = qx + dx; if (nx < 0 || nx >= W) continue;
          const n = ny * W + nx;
          if (label[n] === -1 && a[n * 4 + 3] >= CUT) { label[n] = comps.length; stack[sp++] = n; }
        }
      }
    }
    comps.push(c);
  }
  if (!comps.length) return null;

  /* a nuqta is small, and small in both directions — an alif is not */
  const maxArea = comps.reduce((mx, c) => Math.max(mx, c.area), 1);
  const lineH = stackH * k / lines.length;
  const isDot = comps.map(c =>
    c.area < maxArea * .10 &&
    (c.x1 - c.x0) < lineH * .34 &&
    (c.y1 - c.y0) < lineH * .34);

  const mid = bands.map(b => (b[0] + b[1]) / 2);
  const ofLine = comps.map(c => {
    const cy = c.sy / c.area;
    let best = 0, bd = Infinity;
    mid.forEach((mv, i) => { const d = Math.abs(cy - mv); if (d < bd) { bd = d; best = i; } });
    return best;
  });

  /* split the ink into a strokes layer and a nuqte layer */
  const src = fctx.getImageData(0, 0, W, H).data;
  const mainImg = fctx.createImageData(W, H);
  const dotImg = fctx.createImageData(W, H);
  const sumA = lines.map(() => new Float32Array(W));
  const sumY = lines.map(() => new Float32Array(W));
  for (let i = 0; i < N; i++) {
    const id = label[i]; if (id === -1) continue;
    const dst = isDot[id] ? dotImg.data : mainImg.data;
    const o = i * 4;
    dst[o] = src[o]; dst[o + 1] = src[o + 1]; dst[o + 2] = src[o + 2]; dst[o + 3] = src[o + 3];
    if (!isDot[id]) {
      const li = ofLine[id], x = i % W, al = src[o + 3];
      sumA[li][x] += al; sumY[li][x] += al * ((i / W) | 0);
    }
  }
  const mainCv = offscreen(W, H); mainCv.getContext("2d").putImageData(mainImg, 0, 0);
  const dotCv = offscreen(W, H); dotCv.getContext("2d").putImageData(dotImg, 0, 0);

  const dotsByLine = lines.map(() => []);
  comps.forEach((c, id) => {
    if (!isDot[id]) return;
    dotsByLine[ofLine[id]].push({
      x: c.x0, y: c.y0, w: c.x1 - c.x0 + 1, h: c.y1 - c.y0 + 1,
      cx: (c.x0 + c.x1) / 2 + .5, cy: (c.y0 + c.y1) / 2 + .5
    });
  });

  /* per line: where the ink is, and the path the nib rides */
  const linesData = lines.map((t, i) => {
    const A = sumA[i], Y = sumY[i];
    const ys = new Float32Array(W);
    let x0 = -1, x1 = -1;
    for (let x = 0; x < W; x++) {
      if (A[x] > 0) { ys[x] = Y[x] / A[x]; if (x0 < 0) x0 = x; x1 = x; }
      else ys[x] = NaN;
    }
    if (x0 < 0) { x0 = 0; x1 = W - 1; ys.fill(H / 2); }
    let last = ys[x0];
    for (let x = x0; x <= x1; x++) { if (isNaN(ys[x])) ys[x] = last; else last = ys[x]; }
    const sm = new Float32Array(W);
    const R = Math.max(2, Math.round(W * .012));
    for (let x = x0; x <= x1; x++) {
      let s = 0, n = 0;
      for (let d = -R; d <= R; d++) { const q = x + d; if (q < x0 || q > x1) continue; s += ys[q]; n++; }
      sm[x] = s / n;
    }
    return {
      band: bands[i], x0: x0, x1: x1, ys: sm,
      dots: dotsByLine[i].sort((p, q) => rtl ? q.cx - p.cx : p.cx - q.cx),
      yAt: function (x) {
        const q = Math.min(Math.max(Math.round(x), this.x0), this.x1);
        return this.ys[q] || H / 2;
      }
    };
  });

  /* the timeline: write a line, tap its dots, lift to the next */
  const segs = [];
  let t = 0;
  linesData.forEach((L, i) => {
    if (i > 0) {
      const prev = linesData[i - 1];
      const px = rtl ? prev.x0 : prev.x1, nx = rtl ? L.x1 : L.x0;
      segs.push({
        kind: "move", line: i, t0: t, dur: 300,
        from: { x: px, y: prev.yAt(px) }, to: { x: nx, y: L.yAt(nx) }
      });
      t += 300;
    }
    const dur = 420 + (L.x1 - L.x0) / W * 1050;
    segs.push({ kind: "write", line: i, t0: t, dur: dur });
    t += dur;
    if (L.dots.length) {
      const dd = 78 * L.dots.length + 110;
      segs.push({ kind: "dots", line: i, t0: t, dur: dd });
      t += dd;
    }
  });

  return {
    W: W, H: H, rtl: rtl, main: mainCv, dots: dotCv,
    lines: linesData, segs: segs, total: t, nib: Math.max(8, size * .20)
  };
}

function drawMain(L, x) {
  nctx.save();
  nctx.beginPath();
  const b0 = L.band[0], bh = L.band[1] - L.band[0];
  if (x === null) nctx.rect(0, b0, scene.W, bh);
  else if (scene.rtl) nctx.rect(x, b0, scene.W - x, bh);
  else nctx.rect(0, b0, x, bh);
  nctx.clip();
  nctx.drawImage(scene.main, 0, 0);
  nctx.restore();
}

function drawDots(L, n) {
  for (let i = 0; i < L.dots.length; i++) {
    const d = L.dots[i];
    const k = Math.min(Math.max(n - i, 0), 1);
    if (k <= 0) continue;
    const e = 1 - Math.pow(1 - k, 3);
    const w = d.w * (.55 + .45 * e), h = d.h * (.55 + .45 * e);
    nctx.globalAlpha = e;
    nctx.drawImage(scene.dots, d.x, d.y, d.w, d.h, d.cx - w / 2, d.cy - h / 2, w, h);
  }
  nctx.globalAlpha = 1;
}

function drawNib(x, y, alpha) {
  const s = scene.nib;
  nctx.save();
  nctx.globalAlpha = alpha;
  nctx.translate(x, y);
  nctx.rotate(-0.62);
  nctx.fillStyle = "rgba(108,47,69,.28)";
  nctx.beginPath(); nctx.arc(0, 0, s * .6, 0, 6.2832); nctx.fill();
  const g = nctx.createLinearGradient(0, -s * 7.2, 0, 0);
  g.addColorStop(0, "#d2a46b"); g.addColorStop(.55, "#8d6036"); g.addColorStop(1, "#573620");
  nctx.fillStyle = g;
  nctx.beginPath();
  nctx.moveTo(-s * .62, -s * 7.4); nctx.lineTo(s * .62, -s * 7.4);
  nctx.lineTo(s * .44, -s * 1.2); nctx.lineTo(-s * .44, -s * 1.2);
  nctx.closePath(); nctx.fill();
  nctx.fillStyle = "#3b2130";
  nctx.beginPath();
  nctx.moveTo(-s * .44, -s * 1.2); nctx.lineTo(s * .44, -s * 1.2);
  nctx.lineTo(s * .17, 0); nctx.lineTo(-s * .17, 0);
  nctx.closePath(); nctx.fill();
  nctx.strokeStyle = "rgba(255,255,255,.3)";
  nctx.lineWidth = Math.max(1, s * .09);
  nctx.beginPath(); nctx.moveTo(0, -s * 1.1); nctx.lineTo(0, -s * .2); nctx.stroke();
  nctx.restore();
}

function paintPen(time, showNib) {
  if (!scene) return;
  nctx.clearRect(0, 0, scene.W, scene.H);
  let nib = null;
  for (let i = 0; i < scene.segs.length; i++) {
    const seg = scene.segs[i];
    if (time < seg.t0) break;
    const L = scene.lines[seg.line];
    const done = time >= seg.t0 + seg.dur;
    const p = done ? 1 : (time - seg.t0) / seg.dur;
    if (seg.kind === "write") {
      const e = easeWrite(p);
      const x = scene.rtl ? L.x1 - (L.x1 - L.x0) * e : L.x0 + (L.x1 - L.x0) * e;
      drawMain(L, done ? null : x);
      if (!done) nib = { x: x, y: L.yAt(x), a: 1 };
    } else if (seg.kind === "dots") {
      drawDots(L, p * L.dots.length);
      if (!done) {
        const d = L.dots[Math.min(Math.floor(p * L.dots.length), L.dots.length - 1)];
        if (d) nib = { x: d.cx, y: d.cy, a: 1 };
      }
    } else if (!done) {
      nib = {
        x: seg.from.x + (seg.to.x - seg.from.x) * p,
        y: seg.from.y + (seg.to.y - seg.from.y) * p - scene.H * .2 * Math.sin(Math.PI * p),
        a: .5
      };
    }
  }
  if (showNib && nib) drawNib(nib.x, nib.y, nib.a);
}

function runPen(token) {
  if (penRaf) cancelAnimationFrame(penRaf);
  if (reduced) { paintPen(scene.total, false); stage.classList.add("written"); return; }
  stage.classList.remove("written");
  const DELAY = 480, t0 = performance.now();
  (function step(now) {
    if (token !== penToken) return;
    const t = Math.max(now - t0 - DELAY, 0);
    paintPen(t, true);
    if (t < scene.total) penRaf = requestAnimationFrame(step);
    else { penRaf = null; stage.classList.add("written"); }
  })(t0);
}

async function writeName() {
  const token = ++penToken;
  els.addr.classList.add("armed");
  try {
    if (document.fonts && document.fonts.load) {
      await document.fonts.load(fontFor(64), CONFIG.envelope[lang].join(""));
    }
  } catch (e) { /* draw with whatever face is available */ }
  if (token !== penToken) return;
  try { scene = buildScene(); } catch (e) { scene = null; }
  if (!scene) { stage.classList.add("written"); return; }
  runPen(token);
}

function refreshName() {
  if (!scene) return;
  try { scene = buildScene(); } catch (e) { return; }
  if (scene) paintPen(scene.total, false);
}

function reseal() {
  letterScreen.hidden = true;
  stage.hidden = false;
  stage.classList.remove("gone", "opening");
  void stage.offsetWidth;
  env.classList.remove("open");
  window.scrollTo({ top: 0, behavior: "auto" });
  env.focus({ preventScroll: true });
  writeName();
}

env.addEventListener("click", openLetter);
$("#resealBtn").addEventListener("click", reseal);
$("#loveBtn").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 22);
});

/* ==========================================================
   5. PETALS + HEARTS (lightweight canvas)
   ========================================================== */
const cvs = $("#petals");
const ctx = cvs.getContext("2d");
let W = 0, H = 0, dpr = 1, parts = [], bursts = [], raf = null;

function sizeCanvas() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.floor(W * dpr);
  cvs.height = Math.floor(H * dpr);
  cvs.style.width = W + "px";
  cvs.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const rnd = (a, b) => a + Math.random() * (b - a);
const TINTS = ["226,135,154", "248,205,214", "240,168,185", "199,161,90", "255,255,255"];

function makePart(seeded) {
  return {
    x: rnd(0, W),
    y: seeded ? rnd(-H, H) : rnd(-80, -10),
    s: rnd(6, 13),
    vy: rnd(18, 46),           // px per second
    vx: rnd(-14, 14),
    sway: rnd(0.4, 1.1),
    phase: rnd(0, Math.PI * 2),
    rot: rnd(0, Math.PI * 2),
    vr: rnd(-0.7, 0.7),
    tint: TINTS[(Math.random() * TINTS.length) | 0],
    alpha: rnd(0.35, 0.8),
    heart: Math.random() < 0.34
  };
}

function seed() {
  const n = W < 520 ? 16 : W < 900 ? 24 : 32;
  parts = Array.from({ length: n }, () => makePart(true));
}

function petalPath(c, s) {
  c.beginPath();
  c.moveTo(0, -s);
  c.bezierCurveTo(s * 0.85, -s * 0.6, s * 0.7, s * 0.65, 0, s);
  c.bezierCurveTo(-s * 0.7, s * 0.65, -s * 0.85, -s * 0.6, 0, -s);
  c.closePath();
}

function heartPath(c, s) {
  const k = s * 0.92;
  c.beginPath();
  c.moveTo(0, k * 0.72);
  c.bezierCurveTo(-k * 1.35, -k * 0.2, -k * 0.5, -k * 1.15, 0, -k * 0.42);
  c.bezierCurveTo(k * 0.5, -k * 1.15, k * 1.35, -k * 0.2, 0, k * 0.72);
  c.closePath();
}

function drawOne(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = "rgba(" + p.tint + ",1)";
  (p.heart ? heartPath : petalPath)(ctx, p.s);
  ctx.fill();
  ctx.restore();
}

function burst(x, y, n) {
  if (reduced) return;
  for (let i = 0; i < n; i++) {
    bursts.push({
      x, y,
      vx: rnd(-150, 150),
      vy: rnd(-260, -70),
      s: rnd(7, 14),
      rot: rnd(0, 6.28),
      vr: rnd(-3, 3),
      life: 1,
      tint: TINTS[(Math.random() * 3) | 0],
      heart: true,
      alpha: 1
    });
  }
  if (!raf) raf = requestAnimationFrame(loop);
}

let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000 || 0, 0.05);
  last = ts;
  ctx.clearRect(0, 0, W, H);

  for (const p of parts) {
    p.y += p.vy * dt;
    p.phase += dt * p.sway;
    p.x += (p.vx + Math.sin(p.phase) * 18) * dt;
    p.rot += p.vr * dt;
    if (p.y - p.s > H) Object.assign(p, makePart(false));
    if (p.x < -40) p.x = W + 30;
    if (p.x > W + 40) p.x = -30;
    drawOne(p);
  }

  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.vy += 380 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += b.vr * dt;
    b.life -= dt * 0.55;
    b.alpha = Math.max(b.life, 0);
    if (b.life <= 0 || b.y > H + 60) { bursts.splice(i, 1); continue; }
    drawOne(b);
  }

  raf = requestAnimationFrame(loop);
}

function start() {
  if (raf) return;
  last = performance.now();
  raf = requestAnimationFrame(loop);
}
function stop() {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
}

let resizeT = null;
addEventListener("resize", () => {
  sizeCanvas(); seed();
  clearTimeout(resizeT);
  resizeT = setTimeout(refreshName, 220);
}, { passive: true });
document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());

/* ==========================================================
   6. BOOT
   ========================================================== */
sizeCanvas();
if (reduced) {
  seed();
  ctx.clearRect(0, 0, W, H);
  parts.forEach(p => { p.alpha *= 0.6; drawOne(p); });
} else {
  seed();
  start();
}
applyLang(pickInitialLang(), false);

const fontsReady = (document.fonts && document.fonts.ready)
  ? document.fonts.ready
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(writeName);
setTimeout(() => stage.classList.add("written"), 5200);   // hint shows up regardless
</script>
</body>
